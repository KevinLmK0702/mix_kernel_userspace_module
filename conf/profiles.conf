# fps_boost profiles 配置文件
# 格式:  <包名|*|!包名>  <target_fps> <margin_fps> <boost_pct> <hold_ms> [rtg_id]
#   包名   = 精确匹配（优先于 *，与行序无关）
#   *      = 全局默认：作为参数默认值（前台应用没被显式列出时用）
#   !包名  = 黑名单：命中的应用完全不接管（写 enable 0），跑分/敏感应用用它
#   -      = 该字段不写，沿用「模式预设 + opts.conf」的值（推荐给 boost_pct/hold_ms）
#   target_fps : 目标帧率 1-300；也支持帧率档位列表，如 60,90,120 或 60/90/120
#                （内核按实测帧率匹配当前档位；平局偏向高档，30fps 游戏不会被一直提频）
#   margin_fps : 允许掉帧裕量 0-120（掉到 target-margin 以下才提频）
#   boost_pct  : 提频强度，最低频抬到 max 的百分比 5-100
#   hold_ms    : 掉帧后至少保持提频的时长(ms) 10-10000
#   rtg_id(可选): WALT 关联线程组 id（0=关，1-19；"-" 或缺省=沿用全局值 1）
#   注意：内核默认 governor 已是 walt，且 walt_auto_boost 默认 1 —— 也就是说
#         rtg_id/rtg_mode 挂上组之后 RTG 抬频就已经生效（每 cluster 顶到 max 的 70%）。
#         要改这个频点用 opts.conf 的 rtg_boost_freq；要彻底关掉 RTG 抬频就写
#         rtg_boost_freq 0，或把 walt_auto_boost 设 0。
# 以 # 开头的行是注释。改完无需重启：守护脚本每 ~1s 重读并应用。
# 匹配依据：内核正在跟踪的渲染进程 pid → /proc/<pid>/cmdline 得到包名
#   （取不到才回退 dumpsys 前台应用，且限频 30s）。
#   ! 黑名单 + opts.conf 的 only_listed 1 = 模块只碰你列出的游戏，其余一律不接管。
# 模式预设（powersave/balance/performance/fast，决定 boost_pct/hold_ms/graded/rtg_mode）
# 见 /data/adb/fps_boost_ctl.mode；其它全局开关见 /data/adb/fps_boost_ctl.opts。
# 包名 = 应用 package（如 com.miHoYo.Yuanshen 原神 / com.tencent.tmgp.sgame 王者荣耀）

* 60 1 - - 1
# com.miHoYo.Yuanshen 60 0 - - 1
# com.tencent.tmgp.sgame 60,90,120 1 - - 1
# com.tencent.tmgp.pubgmhd 60 0 100 500 0
# 跑分/基准测试：不想被提频就加黑名单（或把 only_listed 设 1）
# !com.antutu.ABenchMark - - - - -
# !com.primatelabs.geekbench6 - - - - -
# !com.ludashi.benchmark - - - - -

