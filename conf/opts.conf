# fps_boost 全局选项（守护脚本在文件变化时写入 /proc/fps_boost）
# 格式： <键> <值>，按行；# 开头为注释。只允许下列键，写错会被忽略。
#
# 优先级：模式预设（/data/adb/fps_boost_ctl.mode） < 本文件 < profiles.conf 的每应用行。
# 模块升级时，本文件中新增、而用户 /data/adb/fps_boost_ctl.opts 里缺失的键
# 会被自动追加（迁移记录见 fps_boost_ctl.log 的 merge 行）。
# 每应用参数（target_fps/margin_fps/boost_pct/hold_ms/rtg_id）建议写 profiles.conf。
#
# 每应用相关的参数（target_fps/margin_fps/boost_pct/hold_ms/rtg_id）
# 建议写在 profiles.conf 里；这里放全局行为开关。
#
# rtg_id      : WALT 关联线程组 id（0=关，1-19）。默认 1
# rtg_mode    : RTG 挂组时机  0=关 / 1=仅在提频时挂 / 2=跟踪到渲染进程就挂（默认2）
#               模式 2 下是否真的抬频由 walt governor 的 rtg_boost_freq 决定
# floor_en    : 是否抬 cpufreq 最低频（1=抬，默认1；设 0 则只靠 walt governor）
# graded      : 分级提频（1=按低于目标的程度把 boost_pct 线性放大到 100%，默认1）
# ged_target  : 采用 GED 上报的目标帧率（1=采用并换算，默认1；0=只用 target_fps）
# sample_ms   : 控制环周期（ms，默认 200）
# only_listed : 1 = 只对 profiles.conf 里显式列出的包名生效（`*` 只提供参数默认值，
#               不主动接管）；0 = 前台任意应用都套用 `*`（默认）。
#               跑分/其它应用不想被碰就设 1。
# governor    : cpufreq 调度器固定值（默认 walt，本仓库移植的 WALT governor）。
#               守护脚本每 5s 校验并保持，防止 MTK perfmgr 切回 schedutil。
#               keep = 不干预，用系统原生 schedutil。
# rtg_boost_freq : walt governor 的 RTG 目标频点（组活跃时 util 顶到的频率）。
#               值 = kHz 或 max（各 cluster 用自己最高频）。默认注释掉 = 用内核
#               按 walt_auto_boost 算好的每 cluster 默认值（max 的 70%）；要真正
#               关掉 RTG 抬频就显式写 0。此项会被每 5s 保持（governor 被重选会
#               重建 tunable）。
#
# rtg_pid_auto : 1（默认）= 内核没跟踪到渲染 pid 时（GED 静默、只有显示路径帧源），
#               用前台包名在 /proc 里反查主进程 pid 写进 /proc/fps_boost/rtg_pid，
#               让 RTG 仍能挂上组。0 = 不自动填。
# rtg_pid      : 手动指定渲染进程 pid（0 = 用自动/GED）。调试或特殊应用才需要；
#               非 0 时优先于 rtg_pid_auto。
#
# ---- WALT governor tunables ----
# 键名规则：walt_<tunable>，写到各 cluster 的
#   /sys/devices/system/cpu/cpufreq/policyN/walt/<tunable>
# 值 "max" = 该 cluster 自己的最高频。governor 被重选会重建 tunable 目录并复位，
# 所以这些键和 governor 一起每 5s 保持。
# walt_auto_boost   : 1（默认）= hispeed_freq / rtg_boost_freq 为 0 时改用内核算好的
#                     每 cluster 默认值（hispeed 80% / rtg 70% of max）；
#                     0 = 0 即“关闭”，不再自动取值。
# walt_pl           : 1（默认）= 启用 WALT 预测负载（pl）抬频。耗电敏感可设 0。
# walt_hispeed_freq : 高负载时顶到的频率；0 = 用 auto_boost 的每 cluster 默认值。
# walt_hispeed_load : 触发 hispeed 的负载阈值（相对平均容量，内核默认 90）。
# walt_boost        : util 额外百分比缩放（可为负，内核默认 0）。
# walt_adaptive_low_freq / walt_adaptive_high_freq : 自适应频带，0 = 关（默认）。
# 调优参考（只读）：/sys/devices/system/cpu/cpufreq/policyN/walt/decision
#                   /sys/kernel/debug/sched_rtg（每组负载 + active_cpus）
#
only_listed 0
governor walt
rtg_id 1
rtg_mode 2
rtg_pid_auto 1
rtg_pid 0
floor_en 1
graded 1
ged_target 1
# rtg_boost_freq max
walt_auto_boost 1
walt_pl 1
# walt_hispeed_freq max
# walt_hispeed_load 90
# walt_boost 0
# walt_adaptive_low_freq 0
# walt_adaptive_high_freq 0
